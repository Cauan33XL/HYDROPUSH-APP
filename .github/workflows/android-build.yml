name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Build Web (React)
        run: npm run build

      - name: Sincronizar Capacitor
        working-directory: hydropush-capacitor
        run: npx cap sync android

      - name: Dar permissão de execução ao Gradle
        run: chmod +x hydropush-capacitor/android/gradlew

      - name: Gerar APK (Debug)
        working-directory: hydropush-capacitor/android
        run: ./gradlew assembleDebug --no-daemon --warning-mode all

      - name: Upload do APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: hydropush-capacitor/android/app/build/outputs/apk/debug/app-debug.apk